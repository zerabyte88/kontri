name: GitPulse CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v2.0.0)'
        required: false
        default: ''
      release_name:
        description: 'Release Title'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Official release bundle compiled exclusively for 64-bit ARM architecture (arm64-v8a).'
      publish_to_release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Configure Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/gitpulse-release.jks
            STORE_PASS="${KEYSTORE_PASSWORD}"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:-gitpulse}"
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=gitpulse-release.jks\n" "$STORE_PASS" "$KEY_PASS" "$ALIAS" > android/key.properties
            echo "Keystore successfully configured."
          else
            echo "WARNING: KEYSTORE_BASE64 is not set in GitHub Secrets. Falling back to debug signing."
          fi

      - name: Build 64-bit Release APK (ARM64 Only)
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        id: prep
        run: |
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' \r\n')
          INPUT_TAG="${{ inputs.tag_name }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_NAME" == v* ]]; then
            TAG="$REF_NAME"
          elif [ -n "$PUBSPEC_VER" ]; then
            TAG="v$PUBSPEC_VER"
          else
            TAG="v2.0.0"
          fi
          APK_NAME="GitPulse-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.prep.outputs.apk_name }}
          path: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256

      - name: Publish to GitHub Releases
        if: inputs.publish_to_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: ${{ inputs.release_name || format('GitPulse {0} (64-bit ARM)', steps.prep.outputs.tag_name) }}
          body: ${{ inputs.release_notes || 'Official GitPulse Mobile release bundle compiled exclusively for 64-bit ARM architecture (arm64-v8a).' }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
